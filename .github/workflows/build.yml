name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 用仓库 Secrets 里的固定密钥签名，保证每次构建的 APK 都能覆盖安装。
      # 没配 Secrets 时仍然能构建，但签名是这台临时机器的 debug 密钥，下次构建就变了。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=AdaptiveTheme" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，本次 APK 使用临时 debug 签名，无法覆盖安装到其他构建之上。见 README 的签名一节。"
            echo "ARTIFACT_NAME=AdaptiveTheme-temporary-signature" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app/build/outputs/apk/release/*.apk
